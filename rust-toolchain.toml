# The Rust every check runs: the flake's dev shell reads this channel and
# rustup follows it, so a new release's lints arrive only with the commit
# that moves it. The oldest Rust that builds skwird is `rust-version` in
# Cargo.toml.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
# Windows and macOS: their lints, the copies of the client checked for
# Windows, and Windows' tests under Wine (tools/gate.sh).
targets = ["x86_64-pc-windows-gnu", "aarch64-apple-darwin"]
