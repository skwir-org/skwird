# Windows' tests on Windows (docs/PLAN.md, phase 4): NTFS, its pipes and
# Task Scheduler, where Wine has only its own answers. On demand alone: a
# push to a branch ci/windows/... or ci/all/..., or run by hand. The
# runner is a machine of its own, thrown away after, and its user an
# administrator: tests that change the system or need an administrator
# run here (SKWIRD_TEST_MACHINE), never on a developer's own system.
name: windows
on:
  push:
    branches: ["ci/windows/**", "ci/all/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml's channel, for the runner's host (MSVC).
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Every system's crates, as a developer's registry holds them: the
      # client's copies are checked offline for Windows too (tests/vendored.rs).
      - name: fetch
        run: cargo fetch --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # An NTFS volume of the tests' own, S:, on a virtual disk: what reads
      # a volume whole (the file table, the journal) never reads the
      # runner's own (skwird_testkit::ntfs).
      - name: a test volume
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP "skwird-tests.vhdx"
          $script = Join-Path $env:RUNNER_TEMP "skwird-tests.diskpart"
          @"
          create vdisk file="$vhd" maximum=512 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          convert mbr
          create partition primary
          format fs=ntfs quick label=skwird-tests
          assign letter=S
          "@ | Set-Content -Path $script -Encoding ascii
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Volume -DriveLetter S
      - name: tests
        run: cargo test --workspace --no-fail-fast
        env:
          # A machine of the tests' own (skwird_testkit::throwaway).
          SKWIRD_TEST_MACHINE: "1"
          SKWIRD_TEST_NTFS: 'S:\'
