# Routine CI: the gate's checks that run on any Linux machine, on every
# push to main and to a work branch (ci/...), and on pull requests
# (AGENTS.md, Testing). Not the tests that need root, which run in the
# flake's machines, nor those under Wine: tools/gate.sh runs both locally.
# Windows' and macOS' tests run on their own systems on demand
# (windows.yml, macos.yml).
name: ci
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml's channel, components and targets.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Every system's crates, as a developer's registry holds them: the
      # client's copies are checked offline for Windows too (tests/vendored.rs).
      - name: fetch
        run: cargo fetch --locked
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy, this system
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy, Windows
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: clippy, macOS
        run: cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings
      # Each program alone, as a release builds it: the workspace's builds
      # take the features of the tests' kit too (tools/gate.sh).
      - name: each program alone
        run: |
          for target in "" x86_64-pc-windows-gnu aarch64-apple-darwin; do
            for program in skwird skwird-bench; do
              cargo check --locked -p "$program" ${target:+--target "$target"}
            done
          done
      # Ubuntu lets no unprivileged process make a user namespace, which
      # the tests of a mount made below a folder need (skwird_testkit's
      # `in_namespace`): its AppArmor rule lifted, on this runner alone.
      - name: user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: tests
        run: cargo test --workspace --no-fail-fast
