# macOS' tests on macOS (docs/PLAN.md, phase 5). On demand alone: a push
# to a branch ci/macos/... or ci/all/..., or run by hand. The runner is a
# machine of its own, thrown away after.
name: macos
on:
  push:
    branches: ["ci/macos/**", "ci/all/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml's channel, for the runner's host.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Every system's crates, as a developer's registry holds them: the
      # client's copies are checked offline for Windows too (tests/vendored.rs).
      - name: fetch
        run: cargo fetch --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace --no-fail-fast
        env:
          # A runner GitHub hosts, thrown away after its job: the tests
          # that change the system (a LaunchAgent taken by launchd) run
          # here alone (skwird_testkit::throwaway), never on a
          # developer's own Mac.
          SKWIRD_TEST_MACHINE: "1"
