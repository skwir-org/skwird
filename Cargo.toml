[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# skwird's own, every crate's alike (docs/DESIGN.md, decision 11,
# "Versions"): not skwir's, and below 1.0 while the protocol is
# experimental.
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rustix = { version = "1.1", features = ["fs"] }
libc = "0.2.189"
# Windows' calls, raw, as rustix is for Unix (phase 4). The version
# rustix's own dependencies already take.
windows-sys = "0.61.2"
skwird-crawl = { path = "crates/crawl" }
skwird-index = { path = "crates/index" }
skwird-protocol = { path = "crates/protocol" }
skwird-client = { path = "crates/client" }
skwird-testkit = { path = "crates/testkit" }

[workspace.lints.rust]
# Only a module that speaks to the system allows it, with SAFETY comments
# (AGENTS.md, "Unsafe").
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
debug = 1

# What packages ship (tools/package): the release's code, its symbols
# stripped, which those who install it have no use for.
[profile.dist]
inherits = "release"
debug = false
strip = true
