[package]
name = "skwird-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "skwird's index: names in folder blocks, depth first, in chunks rewritten alone"

[dependencies]
# The version skwir's matcher uses, so that globs match alike.
globset = "0.4.22"
skwird-crawl.workspace = true
# The version skwir's matcher uses, so that both forms are made alike.
unicode-normalization = "0.1.26"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["mm"] }

# The index's files mapped (`map`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
] }

[dev-dependencies]
rustix = { workspace = true, features = ["mm", "time"] }
globset = "0.4.22"
skwird-testkit.workspace = true

[lints]
workspace = true
