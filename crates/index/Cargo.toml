[package]
name = "skwird-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "skwird's index: names in folder blocks, depth first, in chunks rewritten alone"

[dependencies]
# The version skwir's query plugin uses, so that globs match alike.
globset = "0.4.21"
skwird-crawl.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["mm"] }

[dev-dependencies]
rustix = { workspace = true, features = ["mm", "time"] }
globset = "0.4.21"
skwird-testkit.workspace = true

[lints]
workspace = true
