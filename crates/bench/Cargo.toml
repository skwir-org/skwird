[package]
name = "skwird-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "What an index of names costs on a real tree, measured before skwird builds one"

[dependencies]
rustix.workspace = true
skwird-crawl.workspace = true
skwird-index.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
# fanotify mounts a btrfs filesystem's top-level subvolume, detached.
rustix = { workspace = true, features = ["event", "mount"] }

[target.'cfg(windows)'.dependencies]
# A process's memory, as Windows counts it (`skwird-bench memory`).
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[dev-dependencies]
skwird-testkit.workspace = true

[lints]
workspace = true
