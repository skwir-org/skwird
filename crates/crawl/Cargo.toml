[package]
name = "skwird-crawl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "skwird's crawl: every folder under a root read, and the check that proves the names current"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["mount"] }

[target.'cfg(target_os = "linux")'.dependencies]
# fanotify and file handles, which rustix has no binding for.
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# getattrlistbulk and getfsstat, which rustix has no binding for.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The walk: folders opened relative to their root, listed in batches
# (docs/PLAN.md, phase 4, step 2).
windows-sys = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }

[dev-dependencies]
skwird-testkit.workspace = true

[lints]
workspace = true
