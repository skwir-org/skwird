[package]
name = "skwird-client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "skwird's client: finds or starts an engine, and asks it; and a fake engine for clients' tests"

# Like skwird-protocol, serde and serde_json beside it, and windows-sys on
# Windows, so that the copies a client keeps build on their own
# (docs/DESIGN.md, Protocol).
[dependencies]
skwird-protocol = { path = "../protocol", version = "0.0.0" }

# Its pipes on Windows (phase 4): a version skwir's lockfile already
# holds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[lints]
workspace = true
