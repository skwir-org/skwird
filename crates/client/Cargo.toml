[package]
name = "skwird-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "skwird's client: finds or starts an engine, and asks it; and a fake engine for clients' tests"

# Like skwird-protocol, serde and serde_json beside it, and windows-sys on
# Windows, so that the copies a client keeps build on their own
# (docs/DESIGN.md, Protocol).
[dependencies]
skwird-protocol = { path = "../protocol", version = "0.2.0" }

# A connect that does not wait on Linux, which holds one while the
# engine's queue is full (`connect_to`): a version skwir's lockfile
# already holds. `fs` besides `net`: rustix 1.1.5 builds `net` alone on
# Linux only with it (1.1.6 does without).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "net"] }

# The user's own temporary folder on macOS (`confstr`), where its engine's
# socket is: a version skwir's lockfile already holds.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

# Its pipes on Windows (phase 4): a version skwir's lockfile already
# holds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[lints]
workspace = true
